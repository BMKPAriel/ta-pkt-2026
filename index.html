.rese{border:1px solid #e3e9f2;border-radius:10px;padding:10px;margin:10px 0;background:#fbfcfe}.reh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.restop{display:grid;grid-template-columns:26px minmax(140px,1.2fr) minmax(120px,1fr) auto auto auto;gap:6px;align-items:center;margin:4px 0}
.restop i{display:inline-flex;width:24px;height:24px;border-radius:50%;color:#fff;font-style:normal;font-weight:700;font-size:12px;align-items:center;justify-content:center}
@media(max-width:640px){.restop{grid-template-columns:26px 1fr auto auto auto}.restop input{grid-column:2/-1;grid-row:2}}
.rprev{margin-top:10px;border-top:1px solid #e3e9f2;padding-top:8px}
@media print{.fpgrid{grid-template-columns:repeat(3,1fr)}.fpc{break-inside:avoid}.fpc .fthumb{width:100%;height:200px}.fpday{break-inside:auto}.fplamp{break-before:page}}
.lhst{flex-wrap:wrap;margin:6px 0}.lhst button{font-size:12.5px;padding:6px 10px}.lhst .pd{max-width:150px;padding:5px 8px}
.lhst button[data-st=close].on{background:#1f9d55;color:#fff;border-color:#1f9d55}.lhst button[data-st=continue].on{background:#2b6cb0;color:#fff;border-color:#2b6cb0}.lhst button[data-st=plan].on{background:#0e2747;color:#fff}.lhst button[data-st=replan].on{background:#d69e2e;color:#fff;border-color:#d69e2e}.lhst button[data-st=waiting].on{background:#c53030;color:#fff;border-color:#c53030}
.lhr.st-close{background:#f3fbf6}.lhr.st-waiting{background:#fdf2f2}.lhr.st-replan{background:#fffaf0}
.lhr{grid-template-columns:minmax(220px,1.2fr) auto auto auto}.lhr .kt{grid-column:2/-1}.lhr .lhst{margin:0}
@media(max-width:900px){.lhr{grid-template-columns:1fr}.lhr .kt{grid-column:1/-1}}
/* v2.10 — impor foto BBM */
.bbfs{display:flex;gap:4px;flex-wrap:wrap;max-width:200px}.bbfs .fthumb{width:44px;height:44px}
.bbimbar{position:sticky;top:0;z-index:5;background:var(--bg,#f4f6f9);padding:8px 0;flex-wrap:wrap}.spacer{flex:1}
.dropz{border:3px dashed #f26b1d;border-radius:16px;padding:40px 20px;text-align:center;background:#fff7f0;cursor:pointer;display:flex;flex-direction:column;gap:8px}.dropz b{font-size:18px;color:#0e2747}.dropz span{color:var(--mut)}.dropz.on{background:#ffe9d9}
.bbent{padding:12px}.bbent.err{border:2px solid #c53030}.bbeh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bbeb{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:14px}@media(max-width:900px){.bbeb{grid-template-columns:1fr}}
.bbph{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}.bbf{width:128px;display:flex;flex-direction:column;gap:4px;font-size:11px}.bbf img{width:128px;height:128px;object-fit:cover;border-radius:10px;border:1px solid #d9e0ea;cursor:zoom-in;background:#eee}
.bbf select{font-size:11.5px;padding:4px}.bbfa{display:flex;gap:3px}.bbfa .btn{padding:3px 7px}.bbf small{color:var(--mut)}
.bbf.add{height:128px;border:2px dashed #b9c4d3;border-radius:10px;align-items:center;justify-content:center;text-align:center;color:#5b6b82;cursor:pointer;font-size:13px}
.zoomov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}.zoomov img{max-width:100%;max-height:88vh;object-fit:contain}
.dxtra{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.dxtra img{width:64px;height:64px;object-fit:cover;border-radius:8px}

.updbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#0e2747;color:#fff;padding:10px 14px;border-radius:12px;z-index:10000;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px;display:flex;gap:10px;align-items:center;max-width:94vw}
.almov{position:fixed;inset:0;background:rgba(14,39,71,.92);z-index:10001;display:flex;align-items:center;justify-content:center;padding:18px}
.almbox{background:#fff;border-radius:22px;padding:22px;max-width:420px;width:100%;text-align:center;animation:almsh .6s ease-in-out 3}.almbox h2{margin:6px 0;color:#0e2747}.almbox p{font-size:16px;color:#33475f}.almic{font-size:64px;animation:almring 1s infinite}
@keyframes almring{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}@keyframes almsh{50%{transform:scale(1.03)}}
.vckm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:4px;padding-top:4px;border-top:1px dashed #d9e0ea}.vckm b{color:#0e2747}
.vcdrv{margin-top:6px;font-size:11.5px;padding:3px 8px}
.rwjam{margin:8px 0}.rwjam summary{cursor:pointer;color:var(--navy,#0e2747);font-weight:600;font-size:13px;padding:6px 0}.rwjam summary select{display:inline-block;width:auto;padding:2px 6px;font-size:12px}
.rwjt tr.diam td{color:#7b8aa0;background:#fafbfc}
.sdr{border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#eef2f7}.sdr.bad{background:#fdecec;border:1px solid #c53030}.sdr.ok{background:#e7f7ee;border:1px solid #1f9d55}.sdr div{font-size:13px;margin:4px 0}.sdr small{color:var(--mut)}

/* ============ PERHITUNGAN PROGRES & JADWAL ============ */

}

function planCurve() {
  const s = S(), wv = vesselWeights(), bob = s.bobot, sch = schedule(); const win = {};
  sch.rows.forEach(r => win[r.v + '|' + r.k] = r);
  const stageWin = (v, i) => { const g = k => win[v + '|' + k]; switch (i) {
    case 0: return [-13, 0]; case 1: return [g(0).st, g(0).en];
    case 2: { const w = g(1); const h = Math.max(w.st, Math.floor((w.st + w.en) / 2)); return [w.st, h]; }
    case 3: { const w = g(1); const h = Math.max(w.st, Math.floor((w.st + w.en) / 2)); return [w.en > h ? h + 1 : h, w.en]; }
    case 4: case 5: return [g(2).st, g(2).en]; case 6: return [g(4).st, g(4).en]; case 7: return [g(3).st, g(3).en]; default: return [g(5).st, g(5).en]; } };
  const daily = {}; let minD = -13, maxD = sch.scEnd;
  s.vessels.forEach(v => bob.forEach((b, i) => { const [a, e] = stageWin(v.id, i); const len = e - a + 1; for (let d = a; d <= e; d++) daily[d] = (daily[d] || 0) + (wv[v.id] || 0) * nnum(b.w) / 100 / len; }));
  const out = []; let c = 0; for (let d = minD; d <= maxD; d++) { c += daily[d] || 0; out.push({d, date: addDays(s.proj.mulai, d - 1), plan: Math.min(1, c)}); }

}
function sCurveSVG(w = 760, h = 300) {
  const pc = planCurve(); const today = todayStr(); const n = pc.length; const L = 46, B = 34, T = 14, Rr = 12; const W = w - L - Rr, H = h - T - B;
  const x = i => L + i / (n - 1) * W, y = v => T + H - v * H;
  let act = []; pc.forEach((p, i) => { if (p.date <= today) act.push([i, progressAt(p.date).total]); });
  const pp = pc.map((p, i) => `${x(i).toFixed(1)},${y(p.plan).toFixed(1)}`).join(' ');
  const ap = act.map(([i, v]) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let g = ''; for (let k = 0; k <= 4; k++) { const yy = y(k / 4); g += `<line x1="${L}" x2="${w - Rr}" y1="${yy}" y2="${yy}" stroke="#e4e7ec"/><text x="${L - 6}" y="${yy + 4}" font-size="10" text-anchor="end" fill="#667085">${k * 25}%</text>`; }
  pc.forEach((p, i) => { if (i % 4 === 0) g += `<text x="${x(i)}" y="${h - 14}" font-size="9.5" text-anchor="middle" fill="#667085">${p.date.slice(8, 10)}/${p.date.slice(5, 7)}</text>`; });
  const i0 = pc.findIndex(p => p.d === 1); if (i0 >= 0) g += `<line x1="${x(i0)}" x2="${x(i0)}" y1="${T}" y2="${T + H}" stroke="#f26b1d" stroke-dasharray="4 3"/><text x="${x(i0) + 4}" y="${T + 10}" font-size="10" fill="#f26b1d">Mulai TA</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Kurva-S">${g}<polyline fill="none" stroke="#0e2747" stroke-width="2.4" points="${pp}"/>${ap ? `<polyline fill="none" stroke="#f26b1d" stroke-width="2.6" points="${ap}"/>` : ''}
   <rect x="${L + 8}" y="${T + 18}" width="12" height="3" fill="#0e2747"/><text x="${L + 24}" y="${T + 22}" font-size="11" fill="#344054">Rencana</text><rect x="${L + 84}" y="${T + 18}" width="12" height="3" fill="#f26b1d"/><text x="${L + 100}" y="${T + 22}" font-size="11" fill="#344054">Aktual</text></svg>`;
}
function planAt(date) { const pc = planCurve(); let v = 0; pc.forEach(p => { if (p.date <= date) v = p.plan; }); return v; }

async function readFields(fields) {

    const el = document.getElementById('f_' + f.k); if (!el) continue;
    if (f.type === 'photo') { const hid = document.getElementById('f_' + f.k + '_v'); if (el.files && el.files[0]) { const d = await readPhoto(el.files[0], 1280, 0.7); Foto.hold(f.k, d); o[f.k] = await Foto.shrink(d); } else o[f.k] = hid.value; continue; }

function realisasiBiaya(until) {
  const per = {}; let total = 0; const add = (k, v) => { k = k || '800'; per[k] = (per[k] || 0) + v; total += v; };

  DB.all('material').forEach(m => { if (m.kode === '-') return; const x = matSaldo(m.id); if (nnum(m.harga) && x.tr && !DB.all('pengeluaran').some(p => p.mat === m.id)) add(m.kode, x.tr * nnum(m.harga)); });
  return {total, per};
}

const kendName = id => { const k = DB.get('kendaraan', id); return k ? k.nopol + (k.unit ? ' · ' + k.unit : '') : '—'; };
const lokName = id => (DB.get('lokasi', id) || {}).nama || '';
function getPos(timeout = 20000) {
  if (Trip.lastPos && Date.now() - Trip.lastPos.t < 90e3) return Promise.resolve(Object.assign({}, Trip.lastPos));
  return new Promise((ok, no) => { if (!('geolocation' in navigator)) return no(new Error('HP tidak mendukung GPS')); navigator.geolocation.getCurrentPosition(p => ok({lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy || 0)}), e => no(new Error(e.code === 1 ? 'Izin lokasi ditolak — aktifkan Lokasi untuk aplikasi ini.' : 'Sinyal GPS belum didapat, coba di tempat terbuka.')), {enableHighAccuracy: true, timeout, maximumAge: 10000}); });
}
function prevKmAkhir(kend, beforeT) { const t = DB.all('trips').filter(x => x.kend === kend && x.selesai && x.tBerangkat < beforeT).sort((a, b) => b.tBerangkat - a.tBerangkat)[0]; return t ? nnum(t.kmAkhir) : null; }
function tripFlags(t) {
  const f = []; const prev = prevKmAkhir(t.kend, t.tBerangkat || 0);
  if (prev !== null && Math.abs(nnum(t.kmAwal) - prev) > 1) f.push(`Selisih KM antarhari ${fmt(nnum(t.kmAwal) - prev)} km`);
  if (t.selesai && nnum(t.kmAkhir) < nnum(t.kmAwal)) f.push('KM akhir < KM awal');
  if (!t.fotoAwal) f.push('Tanpa foto odometer awal'); if (t.selesai && !t.fotoAkhir) f.push('Tanpa foto odometer akhir');
  if (!t.selesai && t.tgl < todayStr()) f.push('Belum ditutup (lupa kembali ke pool?)');
  if (!t.selesai && t.tgl === todayStr() && !Trip.inHours() && new Date().getHours() >= 12) f.push('Lewat batas lembur, belum kembali');
  if (nnum(t.kmNon) > 0) f.push(`KM non-proyek ${fmt(t.kmNon)} km`);
  (t.standby || []).forEach(s => { if (s.pindah) f.push(`Pindah ±${fmt(s.pindah)} m saat standby ${timeStr(new Date(s.t1))}–${timeStr(new Date(s.t2))}`); });
  return f;
}

/* ----- BBM full-to-full ----- */
function bbmCalc() {
  const rows = DB.all('bbm').sort((a, b) => (a.tgl + String(a.km).padStart(9, '0') > b.tgl + String(b.km).padStart(9, '0') ? 1 : -1)); const by = {};

  const res = {}; Object.entries(by).forEach(([k, arr]) => { let lastFull = null, acc = 0; arr.forEach(r => { acc += nnum(r.liter); if (r.full === 'Ya') { if (lastFull) { const km = nnum(r.km) - nnum(lastFull.km); const kml = acc ? km / acc : 0; const std = nnum((DB.get('kendaraan', k) || {}).std); res[r.id] = {km, liter: acc, kml, flag: std && kml < std * .85 ? 'PERIKSA' : (km <= 0 ? 'PERIKSA KM' : 'OK')}; } else res[r.id] = {first: 1}; lastFull = r; acc = 0; } }); });
  return res;
}

function cekDesktopMode() {
  const phone = (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) && Math.min(screen.width, screen.height) <= 520;
  const el = document.getElementById('dskWarn'); const bad = phone && window.innerWidth > Math.max(screen.width, screen.height) * 0.98 + 40 || phone && window.innerWidth >= 900;
  if (!bad) { if (el) el.remove(); return; } if (el || sessionStorage.getItem(P + 'dsk')) return;
  const d = document.createElement('div'); d.id = 'dskWarn'; d.className = 'dskwarn';
  d.innerHTML = `<b>📱 Tampilan HP sedang mode “Situs desktop”</b><span>Huruf jadi kecil & menu bersebelahan. Di Chrome tekan <b>⋮</b> (kanan atas) lalu hilangkan centang <b>Situs desktop</b>.</span><button onclick="sessionStorage.setItem(P+'dsk',1);this.parentNode.remove()">Nanti</button>`;
  document.body.appendChild(d);
}

function boot() {

  if (restoreSession()) renderShell(); else { renderLogin(); if (Sync.configured()) Sync.run().then(() => { if (!SES.user && !document.querySelector('.modal') && !$('#lgPin').value) renderLogin(); }); }
  setTimeout(cekDesktopMode, 400);

/* ---- progres: posisi % dari laporan harian terakhir s.d. tanggal (digabung dengan input volume bila ada) ---- */
function progressAt(date) {
  const s = S(), wv = vesselWeights(), bob = bobotAt(date);
  const sums = {}; DB.all('progres').forEach(p => { if (date && p.tgl > date) return; const k = p.vessel + '|' + p.tahap; sums[k] = (sums[k] || 0) + nnum(p.vol); });
  const L = lhList().filter(r => !date || r.tgl <= date); const last = L[L.length - 1];
  const out = {total: 0, ves: {}};
  s.vessels.forEach(v => {
    let vp = 0; const st = bob.map((b, i) => { const done = sums[v.id + '|' + i] || 0, vol = stageVol(v, b.b); const pv = vol ? Math.min(1, done / vol) : 0; const pl = last ? Math.min(1, lhPos(last, v.id, i) / 100) : 0; const p = Math.max(pv, pl); vp += p * nnum(b.w) / 100; return {p, done: pl > pv ? pl * vol : done, vol, lh: pl > pv}; });
    out.ves[v.id] = {pct: vp, st, w: wv[v.id] || 0}; out.total += vp * (wv[v.id] || 0);
  });
  return out;
}

  s.vessels.forEach(v => { const rows = []; bob.forEach((b, i) => { const p = lhPos(rec, v.id, i), pp = lhPos(prev, v.id, i), d = lhDone(rec, v.id, i), k = lhKet(rec, v.id, i); if (!d && !k && !(p > pp)) return;

  if (rec.kegiatan) { L.push(''); L.push('Kegiatan :'); rec.kegiatan.split('\n').filter(x => x.trim()).forEach(x => L.push('- ' + x.trim())); }

/* ============ TAHAP PEKERJAAN v3 — 6 tahap, sama dengan laporan progres WA lapangan ============

const TV = 3;

const TB = {1: ['pct', 'surf', 'surf', 'surf', 'aer', 'cover', 'cover', 'ls', 'pct'], 2: ['pct', 'surf', 'surf', 'surf', 'surf', 'aer', 'cover', 'cover', 'ls', 'pct']};

    const sumW = (w, v) => { const n = nb.map(() => 0); w.forEach((x, o) => { const t = TMAP[v][o]; if (t !== undefined) n[t] = Math.round((n[t] + nnum(x)) * 100) / 100; }); return n; };
    if (ow.length === TMAP[ver].length) sumW(ow, ver).forEach((w, i) => { nb[i].w = w; });
    s.tahapOldW = Object.assign({}, s.tahapOldW || {}, {[ver]: ow.length === TMAP[ver].length ? ow : TW[ver]}); if (ver === 2 && !s.tahapOldW[1]) s.tahapOldW[1] = TW[1];

  const oldW = v => (s.tahapOldW && s.tahapOldW[v]) || TW[v];
  const recVer = r => r.tv === 2 ? 2 : !r.tv ? 1 : 0;
  DB.all('progres').filter(r => recVer(r)).forEach(r => { const v = recVer(r), o = nnum(r.tahap), n = TMAP[v][o]; if (n === undefined) return;
    const vs = s.vessels.find(x => x.id === r.vessel) || {}; const wN = TMAP[v].reduce((a, t, k) => a + (t === n ? nnum(oldW(v)[k]) : 0), 0) || 1;

    DB.put('progres', {id: r.id, tahap: n, vol: Math.round(nnum(r.vol) * nnum(oldW(v)[o]) / wN * vn / vo * 100) / 100, tv: TV, volAsal: r.vol}, {noAudit: true}); ch++; });

    Object.entries(r.prog || {}).forEach(([vid, o]) => { const N = {}; TMAP[v].forEach((n, k) => { const x = (o || {})[k] || {}; const w = nnum(oldW(v)[k]); const g = N[n] = N[n] || {pw: 0, w: 0, d: false, k: [], s: [], pd: ''};
        g.pw += nnum(x.p) * w; g.w += w; g.d = g.d || !!x.d; if (x.k && !g.k.includes(x.k)) g.k.push(x.k); g.s.push(x.s || ''); if (x.pd && x.pd > g.pd) g.pd = x.pd; });
      P[vid] = {}; Object.entries(N).forEach(([n, g]) => { const st = g.s.every(z => z === 'close') ? 'close' : ['waiting', 'continue', 'replan', 'plan'].find(z => g.s.includes(z)) || '';

    DB.put('lapharian', {id: r.id, prog: P, tv: TV}, {noAudit: true}); ch++; });

/* kurva rencana: jendela waktu per tahap berdasar id tahap (bukan nomor urut) */
function planCurve() {

  const half = (w, second) => { const h = Math.max(w.st, Math.floor((w.st + w.en) / 2)); return second ? [w.en > h ? h + 1 : h, w.en] : [w.st, h]; };

    case 'brpt': return [g(1).st, g(1).en]; case 'brush': return half(g(1), false); case 'paint': return half(g(1), true); case 'aer': case 'seal': return [g(2).st, g(2).en];
    case 'jack': return U([g(4).st, g(4).en], [g(3).st, g(3).en]); case 'qc': return [g(3).st, g(3).en]; default: return [g(5).st, g(5).en]; } };

  s.vessels.forEach(v => bob.forEach((b, i) => { const [a, e] = byId(v.id, b.id || LEG[i] || 'dism'); const len = Math.max(1, e - a + 1); for (let d = a; d <= e; d++) daily[d] = (daily[d] || 0) + (wv[v.id] || 0) * nnum(b.w) / 100 / len; }));

  return out;
}

/* ---------- 2. KM BERSIH — buang lompatan GPS (sinyal jelek) & getaran saat diam ---------- */
function kmBersih(pts) {
  const P = pts.filter(p => !(+p.acc > 120)).sort((a, b) => a.t - b.t); let d = 0, last = null;
  for (const p of P) {
    if (!last) { last = p; continue; }
    const dd = haversine(last, p), dt = (p.t - last.t) / 1000;
    if (dt <= 0) continue;
    if (dt > 20 * 60) { last = p; continue; } // celah panjang: jangan ditarik garis lurus
    if (dd / dt * 3.6 > 110) continue; // lompatan tidak masuk akal (>110 km/j) → titik diabaikan
    if (dd < Math.max(12, (+p.acc || 0) * 0.8)) continue; // getaran GPS saat diam
    d += dd; last = p;
  }
  return d / 1000;
}
function gpsKm(t) { return kmBersih(LS.get('gpslocal', []).filter(x => x.trip === t.id)); }
function gpsPoints(date) { const s = new Map(); [...gpsStore(), ...LS.get('gpslocal', [])].forEach(p => { if (todayStr(new Date(p.t)) === date) s.set((p.kend || p.trip) + '|' + Math.round(p.t / 1000), p); }); return [...s.values()].sort((a, b) => a.t - b.t); }
const estBbmKm = (k, km) => { const std = nnum((k || {}).std) || 8; const l = km / std; return {l, rp: Math.round(l * hargaBbm(k))}; };

{ const base = fleetState;

      if (today && last && (!v.pos || last.t > (v.pos.t || 0) + 30e3) && v.status !== 'standby') { v.pos = last; v.lok = posLabel(last); }

      v.km = kmBersih(kp); v.est = estBbmKm(v.k, v.km);

  const B = {}; P.forEach(p => { const dt = new Date(p.t); const m = dt.getHours() * 60 + dt.getMinutes(); const kk = Math.floor(m / iv) * iv; (B[kk] = B[kk] || []).push(p); });
  const keys = Object.keys(B).map(Number).sort((a, b) => a - b); let cum = 0; const R = [];
  keys.forEach((kk, i) => { const a = B[kk]; const prevLast = i ? B[keys[i - 1]].slice(-1) : []; const km = kmBersih([...prevLast, ...a]); cum += km; R.push({kk, a, km, cum, p0: a[0], p1: a[a.length - 1], gerak: haversine(a[0], a[a.length - 1]) > 120 || km > 0.2}); });
  const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); const cr = p => `${(+p.lat).toFixed(5)}, ${(+p.lng).toFixed(5)}`;
  const nama = p => knownLok(p) || GEO.text(GEO.cache[GEO.key(p)]) || '…';
  const draw = () => { b.innerHTML = `<div class="tbl-wrap"><table class="t small rwjt"><thead><tr><th>Jam</th><th>Dari</th><th>Sampai</th><th>Jalan yang dilewati</th><th class="n">KM</th><th class="n">KM kumulatif</th>${odo0 ? '<th class="n">Odometer ±</th>' : ''}<th class="n">≈ BBM</th><th class="n">≈ Nilai</th></tr></thead><tbody>
    ${R.map(r => { const e = estBbmKm(k, r.km); const via = [...new Set(r.a.filter((x, j) => j % Math.max(1, Math.floor(r.a.length / 6)) === 0).map(x => (GEO.cache[GEO.key(x)] || {}).r).filter(Boolean))].slice(0, 4).join(', ');
      return `<tr class="${r.gerak ? '' : 'diam'}"><td style="white-space:nowrap"><b>${hm(r.kk)}–${hm(Math.min(r.kk + iv, 1440))}</b><br><span class="muted">${r.a.length} titik · ${timeStr(new Date(r.p0.t))}–${timeStr(new Date(r.p1.t))}</span></td>
       <td>${esc(nama(r.p0))}<div class="mono muted">${cr(r.p0)}</div></td><td>${r.gerak ? esc(nama(r.p1)) + `<div class="mono muted">${cr(r.p1)} <a target="_blank" href="https://www.google.com/maps/dir/${r.p0.lat},${r.p0.lng}/${r.p1.lat},${r.p1.lng}">rute</a></div>` : '<span class="muted">diam di tempat</span>'}</td>
       <td>${esc(via || (r.gerak ? '…' : '—'))}</td><td class="n"><b>${fmt(r.km, 2)}</b></td><td class="n">${fmt(r.cum, 1)}</td>${odo0 ? `<td class="n">${fmt(Math.round(odo0 + r.cum))}</td>` : ''}<td class="n">${fmt(e.l, 2)} L</td><td class="n">${rp(e.rp)}</td></tr>`; }).join('')}</tbody>
    <tfoot><tr class="tot"><td colspan="4">Total ${tglID(tgl)} — ${esc(k.nopol || '')} (standar ${fmt(nnum(k.std) || 8, 1)} km/L · ${rp(hargaBbm(k))}/L)</td><td class="n">${fmt(cum, 1)}</td><td></td>${odo0 ? '<td></td>' : ''}<td class="n">${fmt(estBbmKm(k, cum).l, 1)} L</td><td class="n">${rp(estBbmKm(k, cum).rp)}</td></tr></tfoot></table></div>
    <p class="small muted">KM dihitung dari titik GPS yang sudah dibersihkan (lompatan sinyal & getaran saat diam dibuang). Odometer ± = KM awal foto odometer + KM GPS. Nilai BBM = KM ÷ standar km/L × harga BBM.</p>`; };
  draw();
  if (d._geo) return; d._geo = 1; const need = []; R.forEach(r => { need.push(r.p0); if (r.gerak) { need.push(r.p1); r.a.filter((x, j) => j % Math.max(1, Math.floor(r.a.length / 6)) === 0).forEach(x => need.push(x)); } });
  for (const p of need) { if (!document.body.contains(d)) return; if (knownLok(p) || GEO.cache[GEO.key(p)]) continue; try { await GEO.resolve(p); } catch (e) {} draw(); }
  d._geo = 0; draw();
}

/* ---------- 7. PELACAK LATAR BELAKANG — posisi tetap terkirim walau layar HP terkunci ---------- */
const trkKode = k => String(k.trk || k.nopol || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function panduanPelacak() {
  const url = LOCAL.serverUrl || SERVER_BAWAAN || ''; const ks = DB.all('kendaraan').filter(k => k.aktif !== 'Tidak');
  modal('📡 Pelacak latar belakang (HP terkunci tetap terlacak)', `<p>Aplikasi ini berjalan di browser HP, jadi <b>GPS berhenti saat layar dikunci, aplikasi ditutup, atau HP masuk saku</b> — itu sebabnya posisi kadang “diam” lalu tertulis <i>HP driver tidak mengirim posisi</i>. Untuk pelacakan terus-menerus, pasang aplikasi pelacak gratis <b>Traccar Client</b> (Play Store) di HP driver. Aplikasi itu berjalan sebagai layanan latar belakang dan mengirim posisi ke server proyek ini.</p>
   <ol class="small" style="line-height:1.6"><li>Play Store › cari <b>Traccar Client</b> › Instal.</li><li>Buka › isi <b>Device identifier</b> = kode pelacak kendaraan (tabel di bawah).</li><li><b>Server URL</b> = <input class="inp mono" style="font-size:11px" readonly value="${esc(url)}" onclick="this.select()"></li><li>Frequency / interval = <b>30</b> detik · Distance = <b>20</b> m · Accuracy = <b>High</b>.</li><li>Nyalakan <b>Service status</b>. Izinkan lokasi <b>“Izinkan sepanjang waktu”</b> dan matikan penghemat baterai untuk Traccar Client (Pengaturan › Aplikasi › Traccar Client › Baterai › Tidak dibatasi).</li><li>Driver tetap memakai aplikasi proyek untuk BERANGKAT, ISI BBM, TIBA DI POOL — Traccar hanya mengirim posisi.</li></ol>
   <table class="t small"><tr><th>Kendaraan</th><th>Driver</th><th>Kode pelacak (Device identifier)</th></tr>${ks.map(k => `<tr><td>${esc(k.nopol)} · ${esc(k.unit || '')}</td><td>${esc(nameOf(k.drv))}</td><td class="mono"><b>${esc(trkKode(k))}</b></td></tr>`).join('')}</table>
   <p class="small muted">Posisi dari pelacak hanya diterima jam 05.00–23.00 WITA. Perlu Code.gs versi terbaru (Deploy › Manage deployments › New version). Cek berhasil: setelah ±1 menit kendaraan bergerak di Live Tracking walau aplikasi proyek di HP driver tertutup. Fitur ini perlu diuji dulu di satu HP sebelum dipasang ke semua driver.</p>`);
}
{ const base = SCREENS.monitor; SCREENS.monitor = main => { base(main); const h = main.querySelector('.lvhead .sp'); if (h) h.insertAdjacentHTML('afterend', '<button class="lvb" id="moTrk" title="Agar posisi tetap terkirim walau layar HP driver terkunci">📡 Pelacak latar belakang</button>'); const b = $('#moTrk'); if (b) b.onclick = panduanPelacak; }; }

posLabel = function (p) { if (!p) return ''; const n = Trip.nearest(p); const c = `${(+p.lat).toFixed(5)}, ${(+p.lng).toFixed(5)}`; if (!n) { const g = GEO.cache[GEO.key(p)]; return g ? GEO.text(g) : c; } if (n.d < (+n.l.radius || 150)) return 'di ' + n.l.nama; const g = GEO.cache[GEO.key(p)]; if (g && n.d > 1000) return GEO.text(g); return 'dekat ' + n.l.nama + ' (' + (n.d < 1000 ? fmt(n.d) + ' m' : fmt(n.d / 1000, 1) + ' km') + ')'; };

/* ============ CEK SINKRON — supaya penyebab "Gagal sinkron" kelihatan jelas ============ */
function syncDiag() {
  const q = Sync.q(), gq = LS.get('gpsq', []), aq = LS.get('auditq', []), bad = LS.get('syncbad', []), log = LS.get('synclog', []).slice().reverse();
  let used = 0; try { for (let i = 0; i < localStorage.length; i++) used += (localStorage.getItem(localStorage.key(i)) || '').length; } catch (e) {}
  const url = LOCAL.serverUrl || ''; const urlS = url ? url.replace(/^https:\/\/script\.google\.com\/macros\/s\//, '…/').replace(/\/exec$/, '/exec').slice(0, 20) + '…' + url.slice(-12) : '(kosong)';
  const per = {}; q.forEach(x => per[x.c] = (per[x.c] || 0) + 1);
  const info = () => [`Aplikasi v${APP_VER}`, `Pengguna: ${SES.user ? SES.user.nama + ' (' + SES.user.peran + ')' : '-'}`, `HP: ${navigator.userAgent.replace(/.*\((.*?)\).*/, '$1').slice(0, 60)}`, `Online: ${navigator.onLine ? 'ya' : 'TIDAK'}`, `Server: ${urlS}`, `Kode: ${LOCAL.kode ? LOCAL.kode.slice(0, 4) + '…' + LOCAL.kode.slice(-3) : '(kosong)'}${LOCAL.kode === KODE_BAWAAN ? ' (bawaan)' : ' (DIUBAH)'}`, `Antrian data: ${q.length} ${JSON.stringify(per)}`, `Antrian GPS: ${gq.length} · audit: ${aq.length} · foto: ${Foto.n || 0}`, `Ditolak server: ${bad.length}`, `Memori HP: ${fmt(used / 1024)} KB dari ±5.000 KB`, `Sukses terakhir: ${LOCAL.lastOk ? dtID(LOCAL.lastOk) : 'belum pernah'}`, `Status: ${Sync.state} ${Sync.msg || ''}`, ...log.slice(0, 5).map(l => `${dtID(l.t)} ${l.ok ? 'OK' : 'GAGAL'} ${l.m || ''}`)].join('\n');
  modal('🔧 Cek sinkron', `<div class="sdg"><div class="sdr ${Sync.state === 'err' ? 'bad' : Sync.state === 'ok' ? 'ok' : ''}"><b>${Sync.state === 'err' ? '❌ Gagal sinkron' : Sync.state === 'ok' ? '✅ Tersinkron' : Sync.state === 'busy' ? '⏳ Sedang sinkron…' : Sync.state === 'wait' ? '📴 Offline — menunggu sinyal' : 'ℹ️ ' + Sync.state}</b>${Sync.msg ? `<div>${esc(Sync.msg)}</div>` : ''}<small>Sukses terakhir: ${LOCAL.lastOk ? dtID(LOCAL.lastOk) : 'belum pernah'} · v${APP_VER}</small></div>
    <table class="t small"><tr><td>Data menunggu dikirim</td><td class="n"><b>${q.length}</b></td></tr><tr><td>Titik GPS menunggu</td><td class="n"><b>${gq.length}</b></td></tr><tr><td>Foto menunggu</td><td class="n"><b id="sdF">${Foto.n || 0}</b></td></tr><tr><td>Data ditolak server</td><td class="n"><b>${bad.length}</b></td></tr><tr><td>Memori HP terpakai</td><td class="n">${fmt(used / 1024)} KB / ±5.000 KB ${used > 4e6 ? '<span class="pill bad">hampir penuh</span>' : ''}</td></tr><tr><td>Sinyal</td><td class="n">${navigator.onLine ? 'online' : '<span class="pill bad">offline</span>'}</td></tr></table>
    <div id="sdT" class="small" style="margin:8px 0"></div>
    ${log.length ? `<details><summary class="small">Riwayat sinkron (${log.length})</summary><div class="small mono">${log.map(l => `${esc(dtID(l.t))} — ${l.ok ? '✅' : '❌'} ${esc(l.m || '')}`).join('<br>')}</div></details>` : ''}
    ${bad.length ? `<details><summary class="small">Data ditolak server (${bad.length})</summary><div class="small">${bad.map(b => `${esc(b.c)} · ${esc(b.id)} · ${fmt(b.n / 1024)} KB — ${esc(b.err)}`).join('<br>')}</div></details>` : ''}
    <div class="bar" style="flex-wrap:wrap"><button class="btn pri" id="sdRun">🔄 Sinkron sekarang</button><button class="btn" id="sdPing">📡 Tes koneksi server</button>${bad.length ? '<button class="btn" id="sdRe">↩ Kirim ulang data ditolak</button>' : ''}<button class="btn" id="sdCp">📋 Salin info untuk Project Control</button><a class="btn gr" target="_blank" id="sdWa">Kirim info via WA</a></div></div>`);
  $('#sdWa').href = 'https://wa.me/?text=' + encodeURIComponent('Info sinkron aplikasi TA PKT\n' + info());
  $('#sdCp').onclick = () => { try { navigator.clipboard.writeText(info()); toast('Info disalin'); } catch (e) { prompt('Salin teks ini:', info()); } };
  $('#sdRun').onclick = async () => { closeModal(); await Sync.run(true); };
  const re = $('#sdRe'); if (re) re.onclick = () => { const q2 = Sync.q(); bad.forEach(b => { if (!q2.some(x => x.c === b.c && x.id === b.id)) q2.push({c: b.c, id: b.id}); }); LS.set('syncq', q2); LS.del('syncbad'); closeModal(); Sync.run(true); };
  $('#sdPing').onclick = async () => { const el = $('#sdT'); el.textContent = 'Menghubungi server…'; const t0 = Date.now();
    try { const r = await Sync.call('ping', {}, 30000); el.innerHTML = `✅ Server menjawab dalam <b>${((Date.now() - t0) / 1000).toFixed(1)} detik</b>. Kode akses benar.`; }
    catch (e) { el.innerHTML = `❌ ${esc(e.message)} (${((Date.now() - t0) / 1000).toFixed(1)} dtk)` + (/Kode akses/.test(e.message) ? '<br>Kode akses di HP ini berbeda dengan server. Minta Project Control mengatur ulang di Pengaturan.' : /menghubungi|Waktu habis/.test(e.message) ? '<br>Cek sinyal/kuota internet HP. Coba matikan-nyalakan data seluler atau pindah ke WiFi.' : /tidak terbaca/.test(e.message) ? '<br>URL server di HP ini kemungkinan salah / deployment lama.' : ''); } };
  Foto.count().then(n => { const f = $('#sdF'); if (f) f.textContent = n; });
}
/* tombol status sinkron: tekan = sinkron; kalau gagal langsung tampil penjelasannya */
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('#syncBtn'); if (!b) return; e.stopImmediatePropagation(); e.preventDefault(); if (Sync.state === 'err') syncDiag(); else Sync.run(true); }, true);
/* versi lama (≤ v2.6) menyimpan foto odometer/BBM ukuran penuh di dalam data trip saat gagal unggah.
   Itu bisa memenuhi memori HP driver → "Gagal sinkron". Foto besar dipindah ke penyimpanan foto (antre unggah),
   data cukup memegang foto kecil. */
async function fotoRingankan() {
  if (fotoRingankan.jalan) return 0; fotoRingankan.jalan = 1; let n = 0;
  try {
    for (const c of ['trips', 'bbm', 'fotoprog', 'personel', 'qc', 'pengeluaran', 'material', 'dokumen', 'scaffold']) {
      let ch = 0;
      for (const r of DB.raw(c)) for (const k of Object.keys(r)) { const v = r[k];
        if (typeof v === 'string' && v.startsWith('data:image') && v.length > 40000) {
          try { await FotoDB.put({key: Foto.key(c, r.id, k), c, id: r.id, k, d: v, name: c + '_' + k, folder: fotoFolder(c, r.tgl), t: Date.now()}); } catch (e) { continue; }
          r[k] = (await Foto.shrink(v)) || ''; ch++; n++;
        } }
      if (ch) { DB.persist(c); }
    }
  } finally { fotoRingankan.jalan = 0; }
  if (n) { Foto.count(); setTimeout(() => Sync.run(), 1500); }
  return n;
}
setTimeout(() => { fotoRingankan().catch(() => {}); }, 2500);
