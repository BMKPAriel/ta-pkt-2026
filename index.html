<html lang="id"><head><meta charset="utf-8">

<title>Kendali Proyek TA PKT 2026 — Cold Insulation</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{
  --navy:#0e2747;--navy2:#163b66;--ink:#1d2939;--mut:#667085;--line:#e4e7ec;--bg:#f3f5f9;--card:#fff;
  --or:#f26b1d;--red:#c8102e;--grn:#12805c;--yel:#f5b301;--blu:#1f5fbf;--pur:#7d3c98;
  --r:12px;--hh:56px;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blu)}
.hidden{display:none!important}
/* ---------- header */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 60%,#1d4f86 100%);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top .burger{display:none;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;width:38px;height:38px;font-size:20px;cursor:pointer}
.logos{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:5px 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.logos img{display:block;height:30px;width:auto}
.logos .sep{width:1px;height:26px;background:#d0d5dd}
.ttl{display:flex;flex-direction:column;min-width:0}
.ttl b{font-size:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:11.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta-badge{background:var(--or);color:#fff;font-weight:700;font-size:11px;border-radius:999px;padding:3px 10px;letter-spacing:.5px;white-space:nowrap}
.top .sp{flex:1}
.sync{border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;background:#e7f6ee;color:#0b6b48}
.sync.wait{background:#fff4d6;color:#8a5b00}.sync.err{background:#fde2e2;color:#a3141f}.sync.off{background:#e9edf3;color:#475467}
.who{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
/* ---------- layout */
.wrap{display:flex;min-height:calc(100vh - var(--hh))}
.side{width:268px;flex:0 0 268px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;height:calc(100vh - var(--hh));position:sticky;top:var(--hh)}
.main{flex:1;min-width:0;padding:18px 20px 60px}
.grp{border-bottom:1px solid #f0f2f5}
.grp>button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:11px 16px;font-weight:650;font-size:13.5px;color:var(--navy);cursor:pointer;text-align:left}
.grp>button:hover{background:#f6f8fb}
.grp>button .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#eef3fa;color:var(--navy2);flex:0 0 28px}
.grp>button .ic svg{width:16px;height:16px}
.grp>button .chev{margin-left:auto;transition:transform .2s;color:#98a2b3}
.grp.open>button .chev{transform:rotate(90deg)}
.grp.open>button .ic{background:var(--navy);color:#fff}
.sub{max-height:0;overflow:hidden;transition:max-height .25s ease}
.grp.open .sub{max-height:600px}
.sub a{display:block;padding:8px 16px 8px 54px;color:#344054;text-decoration:none;font-size:13px;border-left:3px solid transparent}
.sub a:hover{background:#f6f8fb}
.sub a.act{background:#fff4ec;color:#b84a0c;border-left-color:var(--or);font-weight:600}
.side .foot{padding:14px 16px;font-size:11px;color:var(--mut)}
.scrim{display:none}
@media (max-width:900px){
  .top .burger{display:block}
  .logos img{height:24px}.logos{padding:4px 7px;gap:7px}
  .ttl span{display:none}
  .side{position:fixed;left:0;top:var(--hh);z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  .side.show{transform:none}
  .scrim.show{display:block;position:fixed;inset:var(--hh) 0 0 0;background:rgba(0,0,0,.35);z-index:35}
  .main{padding:14px 12px 70px}
}
@media (max-width:560px){:root{--hh:100px}.top{flex-wrap:wrap;gap:8px;padding:8px 10px;height:var(--hh)}.top .sp{display:none}.ttl{flex:1}.top{flex-wrap:wrap;row-gap:6px}.logos{order:10;flex-basis:100%;justify-content:space-around;padding:5px 8px}.logos img{height:22px}.logos img.l-pkt{height:19px}.ttl b{font-size:14px}.ta-badge{font-size:10px;padding:2px 7px}.who span{display:none}.sync{padding:5px 9px;font-size:11px}}
.card,.paper{overflow-x:auto}
/* ---------- content */
h1.pg{font-size:20px;margin:2px 0 4px;color:var(--navy)}
.pgsub{color:var(--mut);margin:0 0 14px;font-size:13px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;border-top:4px solid var(--navy2)}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:22px;font-weight:700;color:var(--navy);margin-top:2px}.kpi .s{font-size:12px;color:var(--mut)}
.kpi.or{border-top-color:var(--or)}.kpi.gr{border-top-color:var(--grn)}.kpi.rd{border-top-color:var(--red)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;color:#344054}
.btn:hover{background:#f6f8fb}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy2)}
.btn.or{background:var(--or);border-color:var(--or);color:#fff}
.btn.gr{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.rd{background:#fff;border-color:#f3b5bd;color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.big{padding:14px 18px;font-size:16px;border-radius:12px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{border:1px solid #d0d5dd;border-radius:9px;padding:7px 10px;background:#fff;width:100%}
.inp:focus{outline:2px solid #b2ccff;border-color:#84adff}
label.f{display:block;font-size:12px;color:#475467;margin-bottom:4px;font-weight:600}
.fld{margin-bottom:10px}
.tbl-wrap{overflow:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:12.8px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:8px 9px;font-weight:600;position:sticky;top:0;white-space:nowrap}
table.t td{padding:7px 9px;border-top:1px solid #eef0f3;vertical-align:top}
table.t tr:nth-child(even) td{background:#fafbfc}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t td.c,table.t th.c{text-align:center}
table.t tr.tot td{font-weight:700;background:#eef3fa}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:#eef2f6;color:#344054;white-space:nowrap}
.pill.ok{background:#e3f6ec;color:#0b6b48}.pill.warn{background:#fff3d6;color:#8a5b00}.pill.bad{background:#fde2e2;color:#a3141f}.pill.info{background:#e5efff;color:#1d4fa8}
.muted{color:var(--mut)}.small{font-size:12px}
.note{background:#fff8e6;border-left:4px solid var(--yel);padding:9px 12px;border-radius:8px;font-size:12.8px;margin:8px 0}
.note.blue{background:#eef4ff;border-left-color:var(--blu)}
.note.red{background:#fdecec;border-left-color:var(--red)}
.prog{height:9px;background:#eaecf0;border-radius:99px;overflow:hidden}.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--or),#f6a04d)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal .box{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.modal .hd b{font-size:15px;color:var(--navy)}.modal .hd .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:#98a2b3}
.modal .bd{padding:16px}.modal .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,#2a5a92 0%,transparent 60%),linear-gradient(135deg,#0b1f3a,#163b66 55%,#0e2747)}
.lcard{background:#fff;border-radius:18px;width:100%;max-width:440px;box-shadow:0 30px 60px rgba(0,0,0,.35);overflow:hidden}
.lhead{padding:22px 22px 14px;text-align:center;background:linear-gradient(180deg,#fff,#f6f8fb)}
.lhead .lg{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.lhead .lg img{height:38px}.lhead .lg img.bm{height:var(--hh)}
.lhead .ta{display:inline-block;margin-top:14px;background:var(--or);color:#fff;font-weight:800;letter-spacing:1px;border-radius:999px;padding:4px 14px;font-size:12px}
.lhead h2{margin:10px 0 2px;font-size:17px;color:var(--navy)}
.lhead p{margin:0;color:var(--mut);font-size:12.5px}
.lbody{padding:18px 22px 22px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pinpad button{padding:14px 0;font-size:18px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:#f8fafc;cursor:pointer}
.pindots{display:flex;gap:10px;justify-content:center;margin:10px 0}
.pindots i{width:13px;height:13px;border-radius:50%;background:#e4e7ec}.pindots i.on{background:var(--navy)}
.credit{text-align:center;color:#c7d2e1;font-size:11.5px;margin-top:12px}
/* gantt */
.gantt td.d{min-width:30px;text-align:center;font-size:10.5px;padding:4px 2px;font-weight:700;color:#fff}
.v120{background:#0e2747!important}.v146{background:#1f78b4!important}.v147{background:#2a9d8f!important}
/* driver */
.trip-live{border-radius:16px;padding:16px;color:#fff;background:linear-gradient(135deg,#0f7a55,#12a06e)}
.trip-live.off{background:linear-gradient(135deg,#475467,#667085)}
.trip-live .big{font-size:26px;font-weight:800}
#map{height:460px;border-radius:12px;border:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.perm td select{padding:2px 4px;border-radius:6px;border:1px solid #d0d5dd;font-size:12px}
.chip{display:inline-block;background:#eef3fa;color:var(--navy);border-radius:8px;padding:2px 8px;margin:2px;font-size:12px}

.trip-live{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pulse{width:16px;height:16px;border-radius:50%;background:#fff;flex:0 0 16px;box-shadow:0 0 0 0 rgba(255,255,255,.8);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.btn.big{padding:14px 16px;font-size:15px;width:100%}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%}
.paper{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:22px;max-width:1100px}
.kop{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:10px;border-bottom:3px double var(--navy);padding-bottom:10px;margin-bottom:6px}
.kop .kc{text-align:center;color:var(--navy)}.kop .kc b{font-size:16px;letter-spacing:.5px}.kop .kc div{font-weight:600}
.kop .kr{display:flex;flex-direction:column;align-items:flex-end}
.paper h3{font-size:14px;color:var(--navy);margin:14px 0 6px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos figure{margin:0}.photos img{width:100%;height:170px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}.photos figcaption{font-size:11px;color:var(--mut)}
table.ttd{width:100%;margin-top:22px;border-collapse:collapse;text-align:center;font-size:12.5px}table.ttd td{border:1px solid #98a2b3;padding:6px;width:33%}table.ttd td.sg{height:70px}
.credit-p{font-size:10px;color:var(--mut);text-align:right;margin-top:8px}
@media(max-width:700px){.kop{grid-template-columns:90px 1fr;}.kop .kr{display:none}.photos{grid-template-columns:1fr 1fr}.paper{padding:12px}}
@media print{.top,.side,.bar,.noprint,.scrim{display:none!important}.wrap{display:block}.main{padding:0!important;max-width:none}.card,.paper,.kpi{box-shadow:none}.paper{padding:0}body{background:#fff}table.t th{background:#0e2747!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.kpi{border:1px solid #ddd}@page{size:A4;margin:12mm}}
a.btn{text-decoration:none;display:inline-block}

  async wake() { try { if ('wakeLock' in navigator && !this.lock) { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener('release', () => { this.lock = null; }); } } catch (e) {} },

    const pt = {lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6)}; this.lastPos = {lat: pt.lat, lng: pt.lng, acc: Math.round(p.coords.accuracy || 0), t: Date.now()};

  nearest(pt) { let best = null; DB.all('lokasi').forEach(l => { if (l.lat && l.lng) { const d = haversine(pt, {lat: +l.lat, lng: +l.lng}); if (!best || d < best.d) best = {l, d}; } }); return best; }

function bbmCalc() {

  const res = {}; Object.entries(by).forEach(([k, arr]) => { let lastFull = null, acc = 0; arr.forEach(r => { acc += nnum(r.liter); if (r.full === 'Ya') { if (lastFull) { const km = nnum(r.km) - nnum(lastFull.km); const kml = acc ? km / acc : 0; const std = nnum((DB.get('kendaraan', k) || {}).std); res[r.id] = {km, liter: acc, kml, flag: std && kml < std * .85 ? 'PERIKSA' : (km <= 0 ? 'PERIKSA KM' : 'OK')}; } else res[r.id] = {first: 1}; lastFull = r; acc = 0; } }); });
  return res;
}

async function ambilTitik(id) { toast('Mengambil posisi…'); try { const p = await getPos(); const l = DB.get('lokasi', id); l.lat = p.lat; l.lng = p.lng; DB.put('lokasi', l); toast(`Titik tersimpan (±${p.acc} m)`); Router.refresh(true); } catch (e) { toast(e.message); } }

SCREENS.dpr = main => {
  const st = SCREENS.dpr; st.tgl = st.tgl || todayStr(); const s = S(), d = st.tgl, hari = diffDays(s.proj.mulai, d) + 1;
  const pr = progressAt(d), prY = progressAt(addDays(d, -1)), pl = planAt(d);
  const today = DB.all('progres').filter(p => p.tgl === d); const ab = DB.all('absensi').filter(a => a.tgl === d && a.status === 'H');
  const perTim = {}; ab.forEach(a => perTim[a.tim || '-'] = (perTim[a.tim || '-'] || 0) + 1);
  const qc = DB.all('qc').filter(q => q.tgl === d); const foto = today.filter(p => p.foto).slice(0, 6);

  main.insertAdjacentHTML('beforeend', `<div class="bar noprint"><input type="date" class="inp" id="dpT" value="${d}" style="max-width:170px"></div>${shareBar('dp', txt, 'DPR ' + tglID(d) + ' — Cold Insulation Pabrik 5')}
   <div class="paper">${kopHTML('DAILY PROGRESS REPORT', `Tanggal ${tglID(d)} · ${hari < 1 ? 'H' + (hari - 1) + ' sebelum mulai TA' : 'Hari ke-' + hari + ' dari ' + s.proj.durasi}`)}

   <h3>1. Progres per vessel & tahap</h3><table class="t"><tr><th>Tahap</th>${s.vessels.map(v => `<th class="n">${v.id}<br>hari ini</th><th class="n">${v.id}<br>kumulatif</th>`).join('')}</tr>
   ${s.bobot.map((b, i) => `<tr><td>${i + 1}. ${esc(b.n)}</td>${s.vessels.map(v => { const vol = today.filter(p => p.vessel === v.id && +p.tahap === i).reduce((a, p) => a + nnum(p.vol), 0); const x = pr.ves[v.id].st[i]; return `<td class="n">${vol ? fmt(vol, 1) : '—'}</td><td class="n">${pct(x.p)}</td>`; }).join('')}</tr>`).join('')}
   <tr class="tot"><td>Progres vessel</td>${s.vessels.map(v => `<td class="n">${pct(pr.ves[v.id].pct - prY.ves[v.id].pct)}</td><td class="n">${pct(pr.ves[v.id].pct)}</td>`).join('')}</tr></table>
   <div class="grid g2" style="margin-top:12px"><div><h3>2. Manpower hadir</h3><table class="t">${Object.entries(perTim).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join('') || '<tr><td class="muted">Absensi belum diisi</td></tr>'}<tr class="tot"><td>Total</td><td class="n">${ab.length}</td></tr></table></div>

SCREENS.weekly = main => {
  const st = SCREENS.weekly; const s = S(); const w0 = addDays(s.proj.mulai, -14);
  const nowW = Math.max(0, Math.floor(diffDays(w0, todayStr()) / 7)); st.w = st.w ?? Math.min(nowW, 7);
  const a = addDays(w0, st.w * 7), b = addDays(a, 6); const pr = progressAt(b), prA = progressAt(addDays(a, -1)), pl = planAt(b), plA = planAt(addDays(a, -1));
  const qcOpen = DB.all('qc').filter(q => q.status !== 'Tutup'); const isu = DB.all('progres').filter(p => p.tgl >= a && p.tgl <= b && p.ket);

  const txt = `WEEKLY REPORT minggu ${st.w + 1} (${tglID(a)} – ${tglID(b)})\nRencana minggu ini ${pct(pl - plA, 2)} · aktual ${pct(pr.total - prA.total, 2)}\nKumulatif rencana ${pct(pl, 2)} · aktual ${pct(pr.total, 2)} · deviasi ${pct(pr.total - pl, 2)}\nPunch list terbuka: ${qcOpen.length}\n— ${s.proj.sub}`;

   <div class="paper">${kopHTML('WEEKLY PROGRESS REPORT', `Minggu ke-${st.w + 1} · ${tglID(a)} – ${tglID(b)}`)}
   <div class="grid g4" style="margin:12px 0"><div class="kpi"><div class="l">Rencana minggu ini</div><div class="v">${pct(pl - plA, 2)}</div></div><div class="kpi gr"><div class="l">Aktual minggu ini</div><div class="v">${pct(pr.total - prA.total, 2)}</div></div><div class="kpi or"><div class="l">Kumulatif rencana / aktual</div><div class="v">${pct(pl, 1)} / ${pct(pr.total, 1)}</div></div><div class="kpi ${pr.total - pl < 0 ? 'rd' : 'gr'}"><div class="l">Deviasi kumulatif</div><div class="v">${pct(pr.total - pl, 2)}</div></div></div>
   <h3>1. Kurva-S</h3>${sCurveSVG(900, 300)}
   <h3>2. Progres per vessel</h3><table class="t"><tr><th>Vessel</th><th class="n">Bobot</th><th class="n">Awal minggu</th><th class="n">Akhir minggu</th><th class="n">Kenaikan</th></tr>${s.vessels.map(v => `<tr><td>${v.id}</td><td class="n">${pct(pr.ves[v.id].w, 2)}</td><td class="n">${pct(prA.ves[v.id].pct)}</td><td class="n">${pct(pr.ves[v.id].pct)}</td><td class="n">${pct(pr.ves[v.id].pct - prA.ves[v.id].pct)}</td></tr>`).join('')}</table>
   <div class="grid g2" style="margin-top:12px"><div><h3>3. Manpower harian</h3><table class="t">${mpd.map(([d, n]) => `<tr><td>${tglID(d)}</td><td class="n">${n}</td></tr>`).join('')}</table></div>
   <div><h3>4. Punch list terbuka (${qcOpen.length})</h3><table class="t">${qcOpen.slice(0, 12).map(q => `<tr><td>${esc(q.vessel)}</td><td>${esc(q.temuan || q.titik)}</td></tr>`).join('') || '<tr><td class="muted">Tidak ada</td></tr>'}</table>

  $('#psWa').onclick = e => { if (!Sync.configured()) { e.preventDefault(); return toast('Simpan server dulu.'); } e.currentTarget.href = 'https://wa.me/?text=' + encodeURIComponent('Pasang aplikasi Kendali Proyek TA PKT: buka tautan ini di Chrome HP, lalu menu ⋮ › Tambahkan ke layar utama.\n' + setupLink()); };
  $('#psCheck').onclick = async () => { try { const r = await Sync.call('stats', {adminKey: LOCAL.adminKey}); modal('Pemeriksaan sinkron', `<table class="t"><tr><th>Koleksi</th><th class="n">Di HP ini</th><th class="n">Di server</th></tr>${COLS.map(c => `<tr><td>${c}</td><td class="n">${DB.raw(c).length}</td><td class="n">${(r.counts || {})[c] ?? '—'}</td></tr>`).join('')}<tr><td>Titik GPS</td><td class="n">${LS.get('gpslocal', []).length}</td><td class="n">${r.gps ?? '—'}</td></tr></table>`); } catch (e) { toast('Gagal: ' + e.message); } };
  $('#psSaveAll').onclick = () => {
    const n = S();
    $$('[data-p]').forEach(i => n.proj[i.dataset.p] = i.type === 'number' ? Number(i.value) : i.value);
    $$('[data-pk]').forEach(i => { const [x, k] = i.dataset.pk.split('|'); n.paket[x][k] = k === 'nilai' ? Number(i.value) : i.value; });
    $$('[data-v]').forEach(i => { const [x, k] = i.dataset.v.split('|'); n.vessels[x][k] = Number(i.value); });
    $$('[data-t]').forEach(i => { const [x, k] = i.dataset.t.split('|'); n.jadwal.tim[x][k] = k === 'tim' ? i.value : Number(i.value); });
    n.jadwal.jeda = Number($('#psJeda').value); const ur = $('#psUrut').value.split(',').map(x => x.trim()).filter(Boolean);
    if (ur.length !== n.vessels.length || ur.some(x => !n.vessels.find(v => v.id === x))) return toast('Urutan vessel harus memuat ' + n.vessels.map(v => v.id).join(', '));
    n.jadwal.urutan = ur; n.jam.mulai = $('#psJ1').value; n.jam.selesai = $('#psJ2').value; n.jam.interval = Math.max(15, Number($('#psIv').value) || 60);
    $$('[data-pc]').forEach(i => n.pc[i.dataset.pc] = Number(i.value));
    if (!n.proj.mulai || n.proj.durasi < 1) return toast('Tanggal mulai & durasi wajib.');
    saveS(n); toast('Pengaturan tersimpan'); Sync.run(); Router.refresh(true);
  };
  $('#psExp').onclick = () => { const o = {app: 'TA-PKT', ver: APP_VER, t: Date.now()}; COLS.forEach(c => o[c] = DB.raw(c)); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], {type: 'application/json'})); a.download = 'cadangan_ta_pkt_' + todayStr() + '.json'; a.click(); };
  $('#psImp').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (o.app !== 'TA-PKT') throw new Error('Bukan file cadangan aplikasi ini.'); let n = 0; COLS.forEach(c => (o[c] || []).forEach(rec => { if (DB.merge(c, rec)) { n++; Sync.mark(c, rec.id); } })); COLS.forEach(c => DB.persist(c)); Audit.ev('pulihkan cadangan', n + ' data'); toast(n + ' data dipulihkan'); Router.refresh(); } catch (err) { toast(err.message); } }; r.readAsText(f); };
  $('#psReset').onclick = () => confirmBox('Hapus SEMUA data lokal di HP ini? Data yang belum tersinkron akan hilang.', () => { if (Sync.pending()) return toast('Masih ada ' + Sync.pending() + ' data belum terkirim — sinkronkan dulu.'); Object.keys(localStorage).filter(k => k.startsWith(P)).forEach(k => localStorage.removeItem(k)); sessionStorage.clear(); location.reload(); });
};
/* ----- BOBOT TAHAP ----- */
SCREENS.bobot = main => {
  const s = S(), edit = can('bobot', 'P') && !s.bobotLock; const BAS = {pct: '% (input persen)', surf: 'm² permukaan', aer: 'm² aerogel (semua lapis)', cover: 'm² cover', ls: 'lumpsum (1 = selesai)'};
  head(main, 'Bobot Tahap (%)', 'Bobot menentukan kontribusi tiap tahap ke progres vessel. Total wajib 100%. Perubahan berlaku mulai tanggal efektif sehingga progres sebelumnya tidak berubah.');
  main.insertAdjacentHTML('beforeend', `<div class="card">${s.bobotLock ? '<div class="note">Bobot dikunci (sudah disepakati dengan MPJ). Buka kunci untuk mengubah.</div>' : ''}
   <table class="t"><tr><th>#</th><th>Tahap</th><th>Basis volume</th><th class="n">Bobot (%)</th></tr>${s.bobot.map((b, i) => `<tr><td>${i + 1}</td><td>${edit ? `<input class="inp" data-bn="${i}" value="${esc(b.n)}">` : esc(b.n)}</td><td>${edit ? `<select class="inp" data-bb="${i}">${Object.entries(BAS).map(([k, t]) => `<option value="${k}" ${k === b.b ? 'selected' : ''}>${t}</option>`).join('')}</select>` : BAS[b.b]}</td><td class="n">${edit ? `<input class="inp bw" type="number" step="0.5" data-bw="${i}" value="${b.w}" style="max-width:90px;text-align:right">` : b.w + '%'}</td></tr>`).join('')}
   <tr class="tot"><td colspan="3">Total</td><td class="n" id="bwTot">${s.bobot.reduce((a, b) => a + nnum(b.w), 0)}%</td></tr></table>
   ${can('bobot', 'P') ? `<div class="grid g3" style="margin-top:10px">${edit ? `<div class="fld"><label class="f">Berlaku mulai tanggal</label><input class="inp" type="date" id="bwEff" value="${todayStr()}"></div>` : ''}</div><div class="bar">${edit ? '<button class="btn pri" id="bwSave">Simpan bobot</button><button class="btn" id="bwDef">Kembalikan bawaan</button>' : ''}<button class="btn ${s.bobotLock ? 'or' : ''}" id="bwLock">${s.bobotLock ? 'Buka kunci' : 'Kunci bobot'}</button></div>` : ''}</div>
   <div class="card"><h3>Riwayat perubahan</h3>${(s.bobotHist || []).length ? `<table class="t"><tr><th>Berlaku mulai</th>${s.bobot.map((b, i) => `<th class="n">T${i + 1}</th>`).join('')}</tr>${s.bobotHist.map(h => `<tr><td>${h.eff === '0000-01-01' ? 'awal' : tglID(h.eff)}</td>${h.w.map(x => `<td class="n">${x}</td>`).join('')}</tr>`).join('')}</table>` : '<p class="muted">Belum ada perubahan.</p>'}</div>`);
  const tot = () => { const t = $$('.bw').reduce((a, i) => a + nnum(Number(i.value)), 0); $('#bwTot').innerHTML = `<span class="pill ${Math.abs(t - 100) < .001 ? 'ok' : 'bad'}">${fmt(t, 1)}%</span>`; return t; };
  $$('.bw').forEach(i => i.oninput = tot);
  const sv = $('#bwSave'); if (sv) sv.onclick = () => { if (Math.abs(tot() - 100) > .001) return toast('Total bobot harus tepat 100%.'); const n = S(); const old = n.bobot.map(b => b.w); const nw = $$('.bw').map(i => Number(i.value)); n.bobotHist = n.bobotHist || []; if (!n.bobotHist.length) n.bobotHist.push({eff: '0000-01-01', w: old}); const eff = $('#bwEff').value || todayStr(); n.bobotHist = n.bobotHist.filter(h => h.eff !== eff); n.bobotHist.push({eff, w: nw}); n.bobotHist.sort((a, b) => a.eff < b.eff ? -1 : 1); n.bobot.forEach((b, i) => { b.w = nw[i]; b.n = $(`[data-bn="${i}"]`).value; b.b = $(`[data-bb="${i}"]`).value; }); n.bobotEff = eff; saveS(n); Audit.ev('ubah bobot', nw.join('/')); toast('Bobot tersimpan'); Router.refresh(); };
  const df = $('#bwDef'); if (df) df.onclick = () => { DEF_SET.bobot.forEach((b, i) => { const x = $(`[data-bw="${i}"]`); if (x) x.value = b.w; }); tot(); };
  const lk = $('#bwLock'); if (lk) lk.onclick = () => { const n = S(); n.bobotLock = !n.bobotLock; saveS(n); toast(n.bobotLock ? 'Bobot dikunci' : 'Kunci dibuka'); Router.refresh(); };
};
/* ----- PENGGUNA & PIN ----- */
const randPin = () => { let p; do { p = String(Math.floor(100000 + Math.random() * 900000)); } while (BAD_PIN.includes(p)); return p; };
function showPin(u, pin) { modal('PIN awal ' + u.nama, `<p>Berikan PIN ini langsung kepada <b>${esc(u.nama)}</b>. PIN hanya tampil sekali dan wajib diganti saat masuk pertama.</p><div style="font-size:34px;letter-spacing:10px;text-align:center;font-weight:800;color:var(--navy)">${pin}</div>`, [['Kirim via WA', () => window.open('https://wa.me/' + String(u.hp || '').replace(/\D/g, '').replace(/^0/, '62') + '?text=' + encodeURIComponent(`Akun aplikasi Kendali Proyek TA PKT\nNama: ${u.nama}\nPIN awal: ${pin}\nWajib ganti PIN saat masuk pertama.`), '_blank'), 'gr']]); }
SCREENS.users = main => {
  crud(main, {menu: 'users', col: 'users', title: 'Pengguna & PIN', sub: 'Tambah akun, atur peran, reset PIN, buka kunci. Driver otomatis hanya melihat menu Trip Saya & Log BBM.', sort: (a, b) => ROLES.indexOf(a.peran) - ROLES.indexOf(b.peran),
    cols: [{t: 'Nama', k: 'nama'}, {t: 'Jabatan', k: 'jabatan'}, {t: 'Peran', f: r => pill(r.peran, {'Super Admin': 'info', Driver: 'warn'})}, {t: 'No. HP', k: 'hp'}, {t: 'Batas vessel', k: 'vessel'}, {t: 'Status', f: r => r.aktif === false ? '<span class="pill bad">nonaktif</span>' : r.lockUntil > Date.now() ? '<span class="pill bad">terkunci</span>' : r.mustChange ? '<span class="pill warn">belum ganti PIN</span>' : '<span class="pill ok">aktif</span>'}, {t: 'Masuk terakhir', f: r => r.lastLogin ? dtID(r.lastLogin) : '—'}],
    rowBtns: r => `<button class="btn sm or" onclick="resetPin('${r.id}')">Reset PIN</button> ${r.lockUntil > Date.now() ? `<button class="btn sm" onclick="unlockU('${r.id}')">Buka kunci</button> ` : ''}`,
    defaults: () => ({peran: 'Supervisor/Foreman', aktif: 'true'}),
    fields: [{k: 'nama', t: 'Nama', req: 1}, {k: 'jabatan', t: 'Jabatan'}, {k: 'peran', t: 'Peran', type: 'select', opts: ROLES}, {k: 'hp', t: 'No. HP (untuk kirim PIN via WA)'}, {k: 'vessel', t: 'Batasi input progres ke vessel', type: 'select', opts: () => [['', 'Semua vessel'], ...VES()]}, {k: 'aktif', t: 'Status', type: 'select', opts: [['true', 'Aktif'], ['false', 'Nonaktif']]}],
    beforeSave: o => {
      o.aktif = String(o.aktif) !== 'false';
      if (o.id === SES.user.id && (o.peran !== 'Super Admin' || !o.aktif)) throw new Error('Tidak bisa menurunkan / menonaktifkan akun Anda sendiri.');
      if (DB.all('users').some(u => u.id !== o.id && u.nama.trim().toLowerCase() === o.nama.trim().toLowerCase())) throw new Error('Nama sudah dipakai.');
      if (!o.pin) { const pin = randPin(); o.salt = uid(); o.pin = hashPin(pin, o.salt); o.mustChange = true; o.fail = 0; o.lockUntil = 0; setTimeout(() => showPin(o, pin), 300); }
    }});
  $$('[data-d]').forEach(b => { if (b.dataset.d === SES.user.id) b.remove(); });
};
function resetPin(id) { confirmBox('Reset PIN pengguna ini? PIN lama tidak berlaku lagi.', () => { const u = DB.get('users', id); const pin = randPin(); u.salt = uid(); u.pin = hashPin(pin, u.salt); u.mustChange = true; u.fail = 0; u.lockUntil = 0; DB.put('users', u, {noAudit: true}); Audit.ev('reset PIN', u.nama); Router.refresh(true); setTimeout(() => showPin(u, pin), 200); }); }
function unlockU(id) { const u = DB.get('users', id); u.lockUntil = 0; u.fail = 0; DB.put('users', u, {noAudit: true}); Audit.ev('buka kunci', u.nama); toast('Kunci dibuka'); Router.refresh(true); }
/* ----- IZIN AKSES ----- */
SCREENS.izin = main => {
  const st = SCREENS.izin; const us = DB.all('users').filter(u => u.peran !== 'Super Admin'); st.u = us.find(u => u.id === st.u) ? st.u : (us[0] || {}).id;
  head(main, 'Izin Akses per Menu', 'Level: Tidak tampil · Lihat · Input · Ubah · Setujui · Penuh. Menu bertanda 🔒 khusus Super Admin.');
  if (!us.length) { main.insertAdjacentHTML('beforeend', '<div class="card muted">Belum ada pengguna selain Super Admin.</div>'); return; }
  const u = DB.get('users', st.u); const P0 = PRESET[u.peran] || {};
  main.insertAdjacentHTML('beforeend', `<div class="bar"><select class="inp" id="izU" style="max-width:320px">${us.map(x => `<option value="${x.id}" ${x.id === st.u ? 'selected' : ''}>${esc(x.nama)} — ${esc(x.peran)}</option>`).join('')}</select><button class="btn" id="izPre">Kembalikan ke preset peran</button><button class="btn pri" id="izSave">Simpan izin</button></div>
   <div class="tbl-wrap"><table class="t"><tr><th>Grup</th><th>Menu</th><th>Preset ${esc(u.peran)}</th><th>Izin pengguna</th></tr>${ALL_ITEMS.map(i => `<tr><td class="muted small">${esc(MENU.find(g => g.g === i.g).t)}</td><td>${esc(i.t)}</td><td class="small">${SA_ONLY.includes(i.id) ? '🔒' : LV_T[P0[i.id] || '-']}</td><td>${SA_ONLY.includes(i.id) ? '<span class="muted small">🔒 Khusus Super Admin</span>' : `<select class="inp iz" data-m="${i.id}" style="max-width:170px">${LV.map(l => `<option value="${l}" ${perm(u, i.id) === l ? 'selected' : ''}>${LV_T[l]}</option>`).join('')}</select>`}</td></tr>`).join('')}</table></div>`);
  $('#izU').onchange = e => { st.u = e.target.value; Router.refresh(); };
  $('#izPre').onclick = () => { $$('.iz').forEach(s => s.value = P0[s.dataset.m] || '-'); };
  $('#izSave').onclick = () => { const x = DB.get('users', st.u); const p = {}; $$('.iz').forEach(s => { if ((P0[s.dataset.m] || '-') !== s.value) p[s.dataset.m] = s.value; }); x.perms = p; DB.put('users', x); toast('Izin tersimpan — berlaku setelah sinkron di HP pengguna.'); Router.refresh(true); };
};
/* ----- ONLINE ----- */
SCREENS.online = main => {
  head(main, 'Pengguna Online', 'Aktivitas 10 menit terakhir dari semua HP. Akun Super Admin tidak pernah tampil (mode tersembunyi).');
  main.insertAdjacentHTML('beforeend', `<div class="bar"><button class="btn pri" id="onR">⟳ Muat ulang</button></div><div id="onL" class="card muted">${Sync.configured() ? 'Memuat…' : 'Server belum diatur — status online butuh server.'}</div>`);
  const load = async () => { if (!Sync.configured()) return; try { const r = await Sync.call('presence_list', {adminKey: LOCAL.adminKey}); const L = (r.list || []).sort((a, b) => b.t - a.t); const el = $('#onL'); if (!el) return; el.classList.remove('muted'); el.innerHTML = `<table class="t"><tr><th></th><th>Nama</th><th>Peran</th><th>Menu dibuka</th><th>Terakhir aktif</th><th>Perangkat</th></tr>${L.map(x => { const on = Date.now() - x.t < 3 * 60e3; return `<tr><td><i class="dot" style="background:${on ? '#16a34a' : '#98a2b3'}"></i></td><td>${esc(x.n)}</td><td>${esc(x.r)}</td><td>${esc((ALL_ITEMS.find(i => i.id === x.m) || {}).t || x.m)}</td><td>${dtID(x.t)}</td><td class="small muted">${esc(x.dev)}</td></tr>`; }).join('') || '<tr><td colspan="6" class="muted c">Tidak ada yang aktif.</td></tr>'}</table>`; } catch (e) { const el = $('#onL'); if (el) el.textContent = 'Gagal: ' + e.message; } };
  $('#onR').onclick = load; load();
};
/* ----- AUDIT ----- */
SCREENS.audit = main => {
  const st = SCREENS.audit; st.src = st.src || 'local';
  const rows = (st.src === 'server' ? (st.srv || []) : LS.get('auditlocal', [])).slice().sort((a, b) => b.t - a.t);
  const q = (st.q || '').toLowerCase(); const shown = rows.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q)).slice(0, 500);
  const diff = r => { if (!r.b && !r.a) return ''; if (!r.b) return 'baru'; if (!r.a) return 'dihapus'; return Object.keys(r.a).filter(k => String(r.a[k]) !== String(r.b[k])).map(k => `${esc(k)}: <s>${esc(r.b[k] ?? '')}</s> → ${esc(r.a[k])}`).join('<br>'); };
  head(main, 'Jejak Audit', 'Semua tambah / ubah / hapus / masuk / keluar tercatat dengan nama, waktu & perangkat.');
  main.insertAdjacentHTML('beforeend', `<div class="bar"><select class="inp" id="auS" style="max-width:220px"><option value="local" ${st.src === 'local' ? 'selected' : ''}>HP ini</option><option value="server" ${st.src === 'server' ? 'selected' : ''}>Semua perangkat (server)</option></select><button class="btn pri" id="auP">Ambil dari server</button><input class="inp" id="auQ" placeholder="Cari nama / data…" value="${esc(st.q || '')}" style="max-width:240px"><button class="btn" id="auC">Ekspor CSV</button><span class="muted small">${shown.length} catatan</span></div>
   <div class="tbl-wrap"><table class="t"><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Data</th><th>Perubahan</th></tr>${shown.map(r => `<tr><td class="small">${dtID(r.t)}</td><td>${esc(r.un)}</td><td>${pill(r.act, {hapus: 'bad', tambah: 'ok', ubah: 'info'})}</td><td class="small">${esc(r.c)} ${r.c === 'sistem' ? esc(r.id) : ''}</td><td class="small">${diff(r)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted c">Belum ada catatan.</td></tr>'}</table></div>`);
  $('#auS').onchange = e => { st.src = e.target.value; Router.refresh(); };
  $('#auQ').onchange = e => { st.q = e.target.value; Router.refresh(); };
  $('#auP').onclick = async () => { try { await Sync.run(); const r = await Sync.call('audit_pull', {adminKey: LOCAL.adminKey}); st.srv = r.rows || []; st.src = 'server'; toast(st.srv.length + ' catatan diterima'); Router.refresh(); } catch (e) { toast('Gagal: ' + e.message); } };
  $('#auC').onclick = () => csvDownload('audit_' + todayStr() + '.csv', [['Waktu', 'Pengguna', 'Aksi', 'Koleksi', 'ID', 'Sebelum', 'Sesudah', 'Perangkat'], ...shown.map(r => [new Date(r.t).toISOString(), r.un, r.act, r.c, r.id, JSON.stringify(r.b || ''), JSON.stringify(r.a || ''), r.dev])]);
};

/* ============ MULAI APLIKASI ============ */
function boot() {
  seedAll();
  const h = location.hash || '';
  if (h.startsWith('#setup=')) { try { const o = JSON.parse(decodeURIComponent(escape(atob(h.slice(7))))); history.replaceState(null, '', location.pathname); LOCAL.serverUrl = o.u; LOCAL.kode = o.k; LOCAL.lastPull = 0; saveLocal(); renderLogin('Tersambung ke server proyek. Mengambil daftar pengguna…'); Sync.run(true).then(() => renderLogin()); return; } catch (e) { toast('Tautan setup tidak valid'); } }
  if (restoreSession()) renderShell(); else { renderLogin(); if (Sync.configured()) Sync.run().then(() => { if (!SES.user && !document.querySelector('.modal') && !$('#lgPin').value) renderLogin(); }); }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('error', e => console.error('ERR', e.message));
document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', boot) : boot();
</script></body></html>
